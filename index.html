<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ff8f00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Big Burger" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Big Burger Business</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #2b1608; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { width: 100%; height: 100%; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #ff8f00; color: #fff; font: 900 26px Rubik, Arial, sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 16px; text-shadow: 0 3px 0 #4a2c17; }
      #rotate .phone { width: 70px; height: 110px; border: 7px solid #fff; border-radius: 14px; animation: turn 1.8s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><div>Обърни телефона хоризонтално</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
